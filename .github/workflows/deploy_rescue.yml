name: "Build, Test and Deploy Rescue Zero-TOTP"

permissions:
  contents: read
  packages: write
  deployments: write


on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  TAG: ${{ github.ref_name }}
  REF_NAME: ${{ github.ref_name }}
  REPOSITORY: ${{ github.repository }}
  GITHUB_ACTOR_USERNAME: ${{ github.actor }}
  COMMIT_SHA: ${{ github.sha}}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set VERSION
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION set to $VERSION"

  frontend-build:
        needs: [setup]
        runs-on: ubuntu-latest
        name: Build frontend
        steps:
          - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
          - name: Setup Node.js
            uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
            with:
              node-version: lts/*
          - name: Create environment file
            working-directory: ./frontend
            run: bash generate-env.sh '${{ needs.setup.outputs.version }}' '${{secrets.RSA_PUBLIC_KEY}}'
          - name : Install dependencies
            working-directory: ./frontend
            run: npm ci
          - name: Install angular CLI
            run : npm install -g @angular/cli
          - name : Build app
            working-directory: ./frontend
            run:  ng build rescue --configuration production --subresource-integrity
          - name: Set up all paths
            working-directory: ./frontend/dist/rescue/browser
            run: cp index.html 404.html
          - name: Upload Pages artifact
            uses: actions/upload-pages-artifact@v3
            with:
              path: ./rescue/dist/frontend/browser
